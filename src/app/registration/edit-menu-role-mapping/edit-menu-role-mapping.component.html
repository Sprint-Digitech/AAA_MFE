<div class="main">
  <!-- Map Roles Section -->
  <div class="map-roles-section">
    <lib-add-update-form *ngIf="editRoleFormLoaded" [config]="mapRolesFormConfig"></lib-add-update-form>
  </div>

  <!-- Select Roles Section -->
  <div class="select-roles-section" *ngIf="editRoleFormLoaded">
    <h2 class="section-title">Select Menus</h2>
    <div class="select-all-container">
      <mat-checkbox (change)="toggleSelectAll($event.checked)" [checked]="isAllSelected()">
        Select All
      </mat-checkbox>
    </div>
    <div class="menu-categories">
      <ng-container *ngFor="let category of groupedMenuCategories">
        <div class="menu-category">
          <div class="category-header">
            <mat-checkbox 
              [checked]="isCategoryAllSelected(category)" 
              (change)="toggleCategoryAll(category, $event.checked)">
            </mat-checkbox>
            <h3 class="category-title">{{ category.categoryName }}</h3>
          </div>
          <div class="menu-items">
            <div *ngFor="let menu of category.menus" class="menu-item">
              <mat-checkbox 
                [checked]="menu.access" 
                (change)="toggleMenuAccess(menu)">
                {{ menu.menuDisplayName || menu.menuName }}
              </mat-checkbox>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
  </div>

  <!-- Action Buttons -->
  <div *ngIf="editRoleFormLoaded" style="display:flex; gap:12px; margin-top:16px; padding: 0 0 20px;">
    <button class="btn btn-primary" (click)="saveMappings()" style="padding:8px 20px; background:#006aff; color:#fff; border:none; border-radius:7px; font-size:12px; font-weight:600; cursor:pointer;">
      Save
    </button>
    <button class="btn" (click)="goBack()" style="padding:8px 20px; background:#303030; color:#fff; border:none; border-radius:7px; font-size:12px; font-weight:600; cursor:pointer;">
      Back
    </button>
  </div>

  <!-- Assigned Employees Section -->
  <div *ngIf="isEditMode && editRoleFormLoaded" class="assigned-employees-section" style="margin-top:24px; padding:16px; background:#f8f9fa; border-radius:8px; border:1px solid #e0e0e0;">
    <h3 style="font-size:14px; font-weight:600; margin:0 0 12px; color:#333;">Assigned Employees</h3>

    <!-- Assign New Employee -->
    <div style="display:flex; gap:8px; margin-bottom:16px; align-items:center;">
      <input
        type="email"
        [(ngModel)]="newEmployeeEmail"
        placeholder="Enter employee email"
        style="flex:1; padding:7px 12px; border:1px solid #ccc; border-radius:6px; font-size:12px;"
      />
      <button
        (click)="assignEmployee()"
        [disabled]="assigningEmployee"
        style="padding:7px 16px; background:#006aff; color:#fff; border:none; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap;">
        {{ assigningEmployee ? 'Assigning...' : 'Assign Employee' }}
      </button>
    </div>

    <!-- Employee List -->
    <div *ngIf="assignedEmployees.length === 0" style="color:#888; font-size:12px;">No employees assigned to this role yet.</div>
    <div *ngFor="let er of assignedEmployees" style="display:flex; align-items:center; justify-content:space-between; padding:6px 10px; background:#fff; border-radius:5px; margin-bottom:6px; border:1px solid #e8e8e8;">
      <span style="font-size:12px; color:#333;">{{ er.email }}</span>
      <button
        (click)="removeEmployeeFromRole(er.email)"
        style="padding:3px 10px; background:#ff4444; color:#fff; border:none; border-radius:5px; font-size:11px; font-weight:600; cursor:pointer;">
        Remove
      </button>
    </div>
  </div>
</div>
