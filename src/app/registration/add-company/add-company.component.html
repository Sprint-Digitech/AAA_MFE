

  <!-- Preview Section -->
   <div class="main" style="margin-top: 10px;">

  <!-- Custom Logo Upload (bypasses broken fv-image-selector in library) -->
  <div class="logo-upload-section">
    <label class="form-label">
      Upload Logo File <span style="color: #dc3545; font-weight: 700;">*</span>
    </label>
    <div class="logo-container">
      <!-- Preview: logo uploaded -->
      <div class="logo-preview" *ngIf="logoPreview">
        <img [src]="logoPreview" alt="Company Logo" />
        <label class="btn btn-sm btn-outline-primary" style="cursor:pointer; margin-left:10px;">
          Change
          <input type="file" accept="image/*" (change)="onLogoSelected($event)" style="display:none;" />
        </label>
        <button type="button" class="btn btn-sm btn-outline-danger"
                (click)="removeLogo()">Remove</button>
      </div>

      <!-- Upload zone -->
      <div class="upload-area" *ngIf="!logoPreview" (click)="openLogoPicker()" style="cursor:pointer; width:100%;">
        <p>Click to upload company logo</p>
        <p>JPG, PNG, GIF supported</p>
        <div class="btn btn-outline-primary" style="pointer-events:none;">Browse Files</div>
        <input #logoFileInput type="file" accept="image/*"
               (change)="onLogoSelected($event)" style="display:none;" />
      </div>
    </div>
    <span class="text-danger" *ngIf="logoError">Company Logo is required</span>
  </div>

  <lib-add-update-form *ngIf="addCompanyFormLoaded" [config]="companyFormConfig" [formGroup]="companyForm">
  </lib-add-update-form>
</div>
